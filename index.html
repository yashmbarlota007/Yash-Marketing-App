<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Yash Marketing</title>
    <meta name="apple-mobile-web-app-title" content="Yash Marketing">
    <meta name="application-name" content="Yash Marketing">
    <link rel="icon" href="https://ui-avatars.com/api/?name=Yash+Marketing&background=1e3a8a&color=fff&rounded=true&bold=true">
    <link rel="apple-touch-icon" href="https://ui-avatars.com/api/?name=Yash+Marketing&background=1e3a8a&color=fff&size=180&bold=true">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <style>
        body { -webkit-tap-highlight-color: transparent; }
        .spinner { border-top-color: #3498db; animation: spinner 1.5s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        // APKA NAYA API LINK YAHAN HAI
        const API_URL = "https://script.google.com/macros/s/AKfycbzzV6p9WpI0M2KzQ4rP4k_R6X7Uu3T_V5b2sN3kXQk9m9m9m9m9m9m9m9m9/exec"; 
        const LOGO_URL = "https://ui-avatars.com/api/?name=Yash+Marketing&background=1e3a8a&color=fff&size=256&rounded=true&bold=true";

        function getSmartImage(product) {
            if (product.ImageURL && product.ImageURL.trim() !== "") return product.ImageURL;
            var brand = (product.Brand || "").toUpperCase();
            if (brand.indexOf("BOAT") > -1) return "https://upload.wikimedia.org/wikipedia/commons/thumb/8/8b/Boat_Logo.webp/512px-Boat_Logo.webp.png";
            if (brand.indexOf("PORTRONICS") > -1) return "https://portronics.com/cdn/shop/files/Portronics_Logo_01_1.png";
            if (brand.indexOf("JBL") > -1) return "https://upload.wikimedia.org/wikipedia/commons/thumb/1/1b/JBL_logo.svg/512px-JBL_logo.svg.png";
            if (brand.indexOf("HIKVISION") > -1) return "https://upload.wikimedia.org/wikipedia/commons/thumb/8/82/Hikvision_logo.svg/512px-Hikvision_logo.svg.png";
            if (brand) return "https://ui-avatars.com/api/?name=" + encodeURIComponent(brand) + "&background=f3f4f6&color=1e3a8a&size=200&bold=true";
            return null; 
        }

        function App() {
            const [user, setUser] = useState(null);
            const [view, setView] = useState("catalog"); 
            const [products, setProducts] = useState([]);
            const [cart, setCart] = useState({});
            const [loading, setLoading] = useState(false);

            const callAPI = async (payload) => {
                try {
                    const response = await fetch(API_URL, {
                        method: 'POST',
                        body: JSON.stringify(payload),
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                    });
                    return await response.json();
                } catch (e) {
                    return { success: false, message: "Network Error: Check Internet" };
                }
            };

            if (!user) return <LoginScreen onLogin={setUser} callAPI={callAPI} loading={loading} setLoading={setLoading} />;

            return (
                <div className="max-w-md mx-auto bg-gray-100 min-h-screen relative pb-24 shadow-xl">
                    <div className="bg-blue-900 text-white p-4 sticky top-0 z-40 flex justify-between items-center shadow-md">
                        <div>
                            <h1 className="font-extrabold text-lg flex items-center gap-2">
                                <img src={LOGO_URL} className="w-7 h-7 rounded-full border border-blue-400" />
                                Yash Marketing
                            </h1>
                            <p className="text-[10px] text-blue-200 font-bold uppercase mt-1">{user.shopName}</p>
                        </div>
                        {view === "cart" && <button onClick={() => setView("catalog")} className="text-white text-xs font-bold bg-blue-800 px-3 py-2 rounded-lg">← BACK</button>}
                    </div>
                    {view === "catalog" ? <Catalog callAPI={callAPI} cart={cart} setCart={setCart} products={products} setProducts={setProducts} setView={setView} /> : <Cart user={user} cart={cart} setCart={setCart} setView={setView} callAPI={callAPI} />}
                </div>
            );
        }

        function LoginScreen({ onLogin, callAPI, loading, setLoading }) {
            const [phone, setPhone] = useState("");
            const handleLogin = async () => {
                if(phone.length < 10) return alert("Enter 10-digit number");
                setLoading(true);
                const res = await callAPI({ action: "verifyDealer", phone: phone });
                setLoading(false);
                if (res.success) onLogin({ phone, shopName: res.shopName });
                else alert(res.message);
            };
            return (
                <div className="flex flex-col items-center justify-center min-h-screen bg-gray-100 p-6 text-center">
                    <div className="bg-white p-8 rounded-3xl shadow-2xl w-full max-w-sm border-t-8 border-blue-900">
                        <img src={LOGO_URL} className="w-24 h-24 mx-auto mb-4 rounded-full border-4 border-gray-50 shadow-lg" />
                        <h2 className="text-3xl font-black mb-1">Yash Marketing</h2>
                        <p className="text-blue-700 font-bold text-xs mb-8 tracking-widest uppercase bg-blue-50 py-1 px-3 rounded-full inline-block">Authorized Dealer Portal</p>
                        <input type="tel" value={phone} onChange={(e) => setPhone(e.target.value)} className="w-full bg-gray-50 p-4 rounded-xl mb-6 text-center font-black text-xl outline-none border border-gray-200" placeholder="MOBILE NO." />
                        <button onClick={handleLogin} disabled={loading} className="w-full bg-blue-900 text-white font-black text-lg p-4 rounded-2xl active:scale-95 shadow-lg flex justify-center">
                            {loading ? <div className="border-4 border-white border-t-transparent w-7 h-7 rounded-full spinner"></div> : "SECURE LOGIN"}
                        </button>
                    </div>
                </div>
            );
        }

        function Catalog({ callAPI, cart, setCart, products, setProducts, setView }) {
            const [loading, setLoading] = useState(products.length === 0);
            const [selectedType, setSelectedType] = useState(null);
            const [searchQuery, setSearchQuery] = useState("");

            useEffect(() => {
                if (products.length === 0) {
                    callAPI({ action: "getProducts" }).then(res => {
                        if (res && res.success) setProducts(res.data);
                        else alert("Data Error: Please check Sheet");
                        setLoading(false);
                    });
                }
            }, []);

            const updateQty = (product, change) => {
                const updated = { ...cart };
                const stockVal = parseInt(product.Stock) || 0;
                const currentQty = updated[product.ItemCode] ? updated[product.ItemCode].qty : 0;
                const newQty = currentQty + change;
                if (newQty > stockVal) return alert("Maximum stock limit reached!");
                if (newQty <= 0) delete updated[product.ItemCode];
                else updated[product.ItemCode] = { ...product, qty: newQty };
                setCart(updated);
            };

            const cartItems = Object.values(cart);
            const totalItems = cartItems.reduce((a, b) => a + b.qty, 0);
            const totalAmount = cartItems.reduce((a, b) => a + (b.DealerPrice * b.qty), 0);

            if (loading) return <div className="flex flex-col justify-center items-center h-[70vh] text-blue-900"><div className="border-4 border-current border-t-transparent w-12 h-12 rounded-full spinner mb-4"></div><p className="font-bold">Syncing Inventory...</p></div>;

            const inStockProducts = products.filter(p => p.Stock && parseInt(p.Stock) > 0);

            // SEARCH BAR UI
            const SearchUI = () => (
                <div className="p-3 bg-white sticky top-[68px] z-30 shadow-sm border-b flex items-center">
                    <input 
                        type="text" 
                        placeholder="Search products, brands..." 
                        value={searchQuery}
                        onChange={(e) => {
                            setSearchQuery(e.target.value);
                            if(e.target.value !== "") setSelectedType(null); // Search karte hi category se bahar
                        }}
                        className="w-full bg-gray-100 p-3 rounded-xl outline-none font-bold text-sm border border-gray-200 focus:border-blue-300 transition-colors"
                    />
                    {searchQuery && (
                        <button onClick={() => setSearchQuery("")} className="ml-2 bg-gray-200 text-gray-600 font-bold px-3 py-3 rounded-xl">✕</button>
                    )}
                </div>
            );

            // PRODUCT CARD RENDERER
            const renderProducts = (productList) => (
                <div className="p-4 grid grid-cols-2 gap-4">
                    {productList.map(p => {
                        const currentQty = cart[p.ItemCode] ? cart[p.ItemCode].qty : 0;
                        const smartImg = getSmartImage(p);
                        return (
                            <div key={p.ItemCode} className="bg-white rounded-2xl p-3 shadow-sm flex flex-col justify-between border border-gray-50 relative">
                                {/* THE NEW PRIVACY STOCK BADGE */}
                                <div className="absolute top-2 right-2 text-[9px] font-black px-2 py-1 rounded-full bg-green-100 text-green-800 shadow-sm border border-green-200 flex items-center gap-1 z-10">
                                    <div className="w-1.5 h-1.5 bg-green-500 rounded-full animate-pulse"></div> IN STOCK
                                </div>
                                <div className="mt-4">
                                    {smartImg ? <img src={smartImg} className="h-20 w-full object-contain mb-2 p-1" /> : <div className="h-20 bg-gray-50 rounded flex items-center justify-center text-gray-300 text-xs mb-2">No Image</div>}
                                    <h3 className="font-bold text-xs leading-snug line-clamp-2 h-8">{p.ProductName}</h3>
                                </div>
                                <div className="mt-3">
                                    <div className="font-black text-lg text-blue-900 mb-2 tracking-tight">₹{p.DealerPrice}</div>
                                    {currentQty > 0 ? (
                                        <div className="flex justify-between items-center bg-blue-50 rounded-xl p-1 border border-blue-100">
                                            <button onClick={() => updateQty(p, -1)} className="bg-white text-blue-900 font-black w-8 h-8 rounded-lg shadow-sm">-</button>
                                            <span className="font-black text-blue-900">{currentQty}</span>
                                            <button onClick={() => updateQty(p, 1)} className="bg-blue-900 text-white font-black w-8 h-8 rounded-lg shadow-sm">+</button>
                                        </div>
                                    ) : (
                                        <button onClick={() => updateQty(p, 1)} className="w-full bg-gray-900 text-white text-xs font-bold py-3 rounded-xl shadow-sm">+ ADD</button>
                                    )}
                                </div>
                            </div>
                        );
                    })}
                </div>
            );

            // LOGIC: Agar search mein kuch likha hai, toh sirf search result dikhao
            if (searchQuery.trim() !== "") {
                const searchResults = inStockProducts.filter(p => 
                    p.ProductName.toLowerCase().includes(searchQuery.toLowerCase()) || 
                    (p.Brand && p.Brand.toLowerCase().includes(searchQuery.toLowerCase()))
                );
                return (
                    <div className="flex flex-col">
                        <SearchUI />
                        {searchResults.length > 0 ? renderProducts(searchResults) : <div className="p-8 text-center font-bold text-gray-400">No products found.</div>}
                        {totalItems > 0 && <CartFooter totalItems={totalItems} totalAmount={totalAmount} setView={setView} />}
                    </div>
                );
            }

            // LOGIC: Agar category select nahi ki, toh Categories dikhao
            if (!selectedType) {
                const types = [...new Set(inStockProducts.map(p => p.Type).filter(Boolean))];
                return (
                    <div className="flex flex-col">
                        <SearchUI />
                        <div className="p-4">
                            <h2 className="font-black text-gray-800 text-xl mb-4">Select Category</h2>
                            <div className="grid grid-cols-2 gap-4">
                                {types.map(type => {
                                    const coverProduct = inStockProducts.find(p => p.Type === type);
                                    const cover = coverProduct ? getSmartImage(coverProduct) : null;
                                    return (
                                        <div key={type} onClick={() => setSelectedType(type)} className="bg-white rounded-2xl p-4 shadow-sm flex flex-col items-center justify-center cursor-pointer active:scale-95 h-40">
                                            {cover ? <img src={cover} className="h-16 object-contain mb-3" /> : <div className="text-3xl mb-3">📦</div>}
                                            <h3 className="font-extrabold text-sm text-center truncate w-full">{type}</h3>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                        {totalItems > 0 && <CartFooter totalItems={totalItems} totalAmount={totalAmount} setView={setView} />}
                    </div>
                );
            }

            // LOGIC: Agar category selected hai, toh uske products dikhao
            const filteredProducts = inStockProducts.filter(p => p.Type === selectedType).sort((a, b) => Number(b.DealerPrice) - Number(a.DealerPrice));
            
            return (
                <div className="flex flex-col">
                    <SearchUI />
                    <div className="p-4 bg-white bg-opacity-95 z-20 border-b flex justify-between items-center shadow-sm">
                        <button onClick={() => setSelectedType(null)} className="font-bold text-blue-900 bg-blue-50 px-3 py-1.5 rounded-lg border border-blue-100 shadow-sm">← Categories</button>
                        <span className="font-black text-gray-800">{selectedType}</span>
                    </div>
                    {renderProducts(filteredProducts)}
                    {totalItems > 0 && <CartFooter totalItems={totalItems} totalAmount={totalAmount} setView={setView} />}
                </div>
            );
        }

        function CartFooter({ totalItems, totalAmount, setView }) {
            return (
                <div className="fixed bottom-4 left-4 right-4 bg-green-600 text-white rounded-2xl shadow-2xl p-4 flex justify-between items-center z-50">
                    <div>
                        <div className="text-[10px] uppercase font-black opacity-80">{totalItems} Total Qty</div>
                        <div className="font-black text-lg leading-none">₹{totalAmount} Total</div>
                    </div>
                    <button onClick={() => setView("cart")} className="bg-white text-green-700 font-black px-6 py-2 rounded-xl shadow-md active:scale-95">VIEW CART →</button>
                </div>
            );
        }

        function Cart({ user, cart, setCart, setView, callAPI }) {
            const [loading, setLoading] = useState(false);
            const [paymentMode, setPaymentMode] = useState(""); 
            const [screenshotUploaded, setScreenshotUploaded] = useState(false);
            const cartItems = Object.values(cart);
            const totalAmount = cartItems.reduce((acc, item) => acc + (item.DealerPrice * item.qty), 0);
            const discountAmount = paymentMode === 'UPI' ? Math.round(totalAmount * 0.02) : 0;
            const finalAmount = totalAmount - discountAmount;

            const handleCheckout = async () => {
                if (!paymentMode) return alert("Please select Payment Mode!");
                if (paymentMode === 'UPI' && !screenshotUploaded) return alert("Upload Payment Screenshot first!");
                setLoading(true);
                const itemsStr = cartItems.map(i => i.ProductName + " x" + i.qty).join(" | ");
                const res = await callAPI({ action: "placeOrder", order: { phone: user.phone, shopName: user.shopName, items: itemsStr, totalAmount, finalAmount, paymentMode }});
                setLoading(false);
                if (res.success) {
                    alert("✅ ORDER CONFIRMED!\n\nDear " + user.shopName + ",\nThank you for choosing Yash Marketing.\n\nOrder ID: " + res.orderId + "\nFinal Amount: ₹" + finalAmount + "\n\nWe will dispatch it shortly.");
                    setCart({}); setView("catalog");
                } else alert("Order failed.");
            };

            return (
                <div className="p-4 bg-gray-50 min-h-screen pb-40">
                    <div className="bg-white rounded-2xl shadow-sm border p-4 mb-6">
                        {cartItems.map(item => (
                            <div key={item.ItemCode} className="flex justify-between items-center border-b last:border-0 py-3">
                                <div className="w-2/3 pr-2">
                                    <h4 className="text-xs font-bold leading-tight">{item.ProductName}</h4>
                                    <div className="text-[10px] text-gray-500 mt-1 font-bold italic">₹{item.DealerPrice} × {item.qty} Qty</div>
                                </div>
                                <div className="font-black text-gray-900 text-sm">₹{item.DealerPrice * item.qty}</div>
                            </div>
                        ))}
                        <div className="flex justify-between items-center mt-3 pt-3 border-t-2 border-dashed border-gray-100">
                            <span className="font-bold text-gray-500 uppercase text-[10px]">Net Value</span>
                            <span className="font-black text-xl text-gray-900">₹{totalAmount}</span>
                        </div>
                    </div>

                    <h2 className="font-black text-gray-800 text-xl mb-4">Payment Options</h2>
                    <div className="space-y-3">
                        <div onClick={() => setPaymentMode('COD')} className={`p-4 rounded-2xl border-2 cursor-pointer transition-all ${paymentMode === 'COD' ? 'border-blue-600 bg-blue-50 shadow-md' : 'border-gray-200 bg-white'}`}>
                            <div className="font-black text-gray-800">Cash On Delivery (COD)</div>
                        </div>
                        <div onClick={() => setPaymentMode('UPI')} className={`p-4 rounded-2xl border-2 cursor-pointer transition-all ${paymentMode === 'UPI' ? 'border-green-600 bg-green-50 shadow-md' : 'border-gray-200 bg-white'}`}>
                            <div className="flex justify-between items-center">
                                <div className="font-black text-green-800 tracking-tight">UPI (2% CASH DISCOUNT)</div>
                                <div className="bg-red-500 text-white text-[8px] px-2 py-0.5 rounded font-black">EXTRA SAVINGS</div>
                            </div>
                            {paymentMode === 'UPI' && (
                                <div className="mt-4 bg-white p-4 rounded-xl border border-green-100 text-center">
                                    <p className="text-xs font-bold mb-3">Pay Exactly: <span className="text-green-600 text-xl font-black">₹{finalAmount}</span></p>
                                    <img src="https://upload.wikimedia.org/wikipedia/commons/d/d0/QR_code_for_mobile_English_Wikipedia.svg" className="w-32 h-32 mx-auto mb-4 border p-1" />
                                    <input type="file" accept="image/*" onChange={(e) => setScreenshotUploaded(true)} className="text-[10px]" />
                                </div>
                            )}
                        </div>
                        <div onClick={() => setPaymentMode('DAILY')} className={`p-4 rounded-2xl border-2 cursor-pointer transition-all ${paymentMode === 'DAILY' ? 'border-purple-600 bg-purple-50 shadow-md' : 'border-gray-200 bg-white'}`}>
                            <div className="font-black text-purple-900">Daily Collection (Auto-Pay)</div>
                            {paymentMode === 'DAILY' && (
                                <div className="mt-4 rounded-xl overflow-hidden shadow-inner border border-purple-100">
                                    <iframe width="100%" height="180" src="https://www.youtube.com/embed/tgbNymZ7vqY" frameBorder="0" allowFullScreen></iframe>
                                </div>
                            )}
                        </div>
                    </div>

                    <div className="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white border-t p-5 rounded-t-3xl shadow-2xl z-50">
                        <div className="flex justify-between items-center mb-1 text-[10px] font-bold text-gray-400 uppercase">
                            <span>Subtotal</span>
                            <span className="line-through">₹{totalAmount}</span>
                        </div>
                        <div className="flex justify-between items-center mb-4">
                            <span className="font-black text-gray-800 text-lg">Final Amount</span>
                            <span className="text-blue-900 text-2xl font-black">₹{finalAmount}</span>
                        </div>
                        <button onClick={handleCheckout} disabled={loading} className={`w-full text-white font-black text-lg py-4 rounded-2xl shadow-lg active:scale-95 flex justify-center items-center ${!paymentMode ? 'bg-gray-300' : 'bg-blue-900'}`}>
                            {loading ? <div className="border-4 border-white border-t-transparent w-6 h-6 rounded-full spinner"></div> : "CONFIRM ORDER"}
                        </button>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
