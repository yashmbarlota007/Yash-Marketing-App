<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Yash Marketing</title>
    <meta name="apple-mobile-web-app-title" content="Yash Marketing">
    <meta name="application-name" content="Yash Marketing">
    <link rel="icon" href="https://ui-avatars.com/api/?name=Yash+Marketing&background=1e3a8a&color=fff&rounded=true&bold=true">
    <link rel="apple-touch-icon" href="https://ui-avatars.com/api/?name=Yash+Marketing&background=1e3a8a&color=fff&size=180&bold=true">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <style>
        body { -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none; }
        .spinner { border-top-color: #3498db; animation: spinner 1.5s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        .animate-slide-up { animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        
        // MASTER VALIDATED API LINK 
        const API_URL = "https://script.google.com/macros/s/AKfycbz13ob1YvN2s7A0lx8ebSH3XiOaY5bKOQzeW6SSnlqi9MMAVrF7b35i4L2hewtLAd2C7g/exec"; 
        const LOGO_URL = "https://ui-avatars.com/api/?name=Yash+Marketing&background=1e3a8a&color=fff&size=256&rounded=true&bold=true";

        function getSmartImage(product) {
            if (product.ImageURL && product.ImageURL.trim() !== "") {
                let url = product.ImageURL.trim();
                
                if (url.indexOf("//") === 0) {
                    url = "https:" + url;
                }
                
                if (url.includes("drive.google.com")) {
                    let fileId = "";
                    const dMatch = url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
                    const idMatch = url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
                    if (dMatch) fileId = dMatch[1];
                    else if (idMatch) fileId = idMatch[1];
                    if (fileId) return "https://drive.google.com/uc?export=view&id=" + fileId;
                }
                return url; 
            }
            
            var brand = (product.Brand || "").toUpperCase();
            if (brand.indexOf("BOAT") > -1) return "https://upload.wikimedia.org/wikipedia/commons/thumb/8/8b/Boat_Logo.webp/512px-Boat_Logo.webp.png";
            if (brand.indexOf("PORTRONICS") > -1) return "https://portronics.com/cdn/shop/files/Portronics_Logo_01_1.png";
            if (brand.indexOf("JBL") > -1) return "https://upload.wikimedia.org/wikipedia/commons/thumb/1/1b/JBL_logo.svg/512px-JBL_logo.svg.png";
            if (brand.indexOf("HIKVISION") > -1) return "https://upload.wikimedia.org/wikipedia/commons/thumb/8/82/Hikvision_logo.svg/512px-Hikvision_logo.svg.png";
            if (brand) return "https://ui-avatars.com/api/?name=" + encodeURIComponent(brand) + "&background=f3f4f6&color=1e3a8a&size=200&bold=true";
            return null; 
        }

        function App() {
            const [user, setUser] = useState(null);
            const [view, setView] = useState("catalog"); 
            const [products, setProducts] = useState([]);
            const [cart, setCart] = useState({});
            const [loading, setLoading] = useState(false);
            const [customerMode, setCustomerMode] = useState(false);

            const logSpyData = (eventName, detailsStr = "") => {
                fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: "logEvent", phone: user ? user.phone : "Unknown", shopName: user ? user.shopName : "Unknown", event: "Login Success", details: detailsStr }),
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                }).catch(e => console.log("Silent Log Failed"));
            };

            const globalProps = { logSpyData, customerMode };

            useEffect(() => {
                const savedUser = localStorage.getItem("yashDealerSession");
                if (savedUser) setUser(JSON.parse(savedUser));
            }, []);

            useEffect(() => {
                window.history.pushState({ page: view }, "", "");
                const handlePopState = () => {
                    if (view === "cart" || view === "ledger") {
                        setView("catalog");
                    } else if (view === "catalog") {
                        window.history.go(-1);
                    }
                };
                window.addEventListener("popstate", handlePopState);
                return () => window.removeEventListener("popstate", handlePopState);
            }, [view]);

            const handleLogout = () => {
                if(window.confirm("Are you sure you want to logout?")) {
                    logSpyData("Logout", "User closed session");
                    localStorage.removeItem("yashDealerSession");
                    setUser(null);
                    setCart({});
                }
            };

            const callAPI = async (payload) => {
                try {
                    const response = await fetch(API_URL, {
                        method: 'POST',
                        body: JSON.stringify(payload),
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                    });
                    return await response.json();
                } catch (e) {
                    return { success: false, message: "Network Error: Check Internet" };
                }
            };

            if (!user) return <LoginScreen onLogin={(data) => { setUser(data); }} callAPI={callAPI} loading={loading} setLoading={setLoading} />;

            return (
                <div className="max-w-md mx-auto bg-gray-100 min-h-screen relative pb-24 shadow-xl">
                    <div className="bg-blue-900 text-white p-4 sticky top-0 z-40 flex justify-between items-center shadow-md">
                        <div>
                            <h1 className="font-extrabold text-sm flex items-center gap-1.5">
                                <img src={LOGO_URL} className="w-6 h-6 rounded-full border border-blue-400" />
                                Yash Marketing
                            </h1>
                            <p className="text-[9px] text-blue-200 font-bold uppercase mt-0.5 truncate max-w-[120px]">{user.shopName}</p>
                        </div>
                        <div className="flex gap-1.5 items-center">
                            {!customerMode && view === "catalog" && (
                                <button onClick={() => setView("ledger")} className="text-white text-[10px] font-bold bg-amber-600 px-2.5 py-2 rounded-lg shadow-sm">📖 LEDGER</button>
                            )}
                            <button onClick={() => {
                                const m = !customerMode;
                                setCustomerMode(m);
                                if (m && view === "ledger") setView("catalog");
                                logSpyData(m ? "Enabled Customer Mode" : "Disabled Customer Mode");
                            }} className={`text-[10px] font-black px-2.5 py-2 rounded-lg transition-colors shadow-sm ${customerMode ? 'bg-green-600 text-white' : 'bg-blue-800 text-blue-100'}`}>
                                {customerMode ? "👥 CUSTOMER" : "💼 DEALER"}
                            </button>
                            {(view === "cart" || view === "ledger") && <button onClick={() => setView("catalog")} className="text-white text-[10px] font-bold bg-blue-800 px-2.5 py-2 rounded-lg">← BACK</button>}
                            <button onClick={handleLogout} className="text-white text-[10px] font-bold bg-red-600 px-2.5 py-2 rounded-lg shadow-sm">LOGOUT</button>
                        </div>
                    </div>
                    {view === "catalog" ? (
                        <Catalog user={user} callAPI={callAPI} cart={cart} setCart={setCart} products={products} setProducts={setProducts} setView={setView} globalProps={globalProps} />
                    ) : view === "cart" ? (
                        <Cart user={user} cart={cart} setCart={setCart} setView={setView} callAPI={callAPI} globalProps={globalProps} />
                    ) : (
                        <LedgerView user={user} callAPI={callAPI} />
                    )}
                </div>
            );
        }

        function LoginScreen({ onLogin, callAPI, loading, setLoading }) {
            const [phone, setPhone] = useState("");
            const handleLogin = async () => {
                if(phone.length < 10) return alert("Enter 10-digit number");
                setLoading(true);
                const res = await callAPI({ action: "verifyDealer", phone: phone });
                setLoading(false);
                if (res.success) {
                    const dealerData = { phone, shopName: res.shopName };
                    localStorage.setItem("yashDealerSession", JSON.stringify(dealerData));
                    
                    fetch(API_URL, {
                        method: 'POST',
                        body: JSON.stringify({ action: "logEvent", phone: dealerData.phone, shopName: dealerData.shopName, event: "Login Success", details: "App Opened" }),
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                    }).catch(e => {});

                    onLogin(dealerData);
                } else alert(res.message);
            };
            return (
                <div className="flex flex-col items-center justify-center min-h-screen bg-gray-100 p-6 text-center">
                    <div className="bg-white p-8 rounded-3xl shadow-2xl w-full max-w-sm border-t-8 border-blue-900">
                        <img src={LOGO_URL} className="w-24 h-24 mx-auto mb-4 rounded-full border-4 border-gray-50 shadow-lg" />
                        <h2 className="text-3xl font-black mb-1">Yash Marketing</h2>
                        <p className="text-blue-700 font-bold text-xs mb-8 tracking-widest uppercase bg-blue-50 py-1 px-3 rounded-full inline-block">Authorized Dealer Portal</p>
                        <input type="tel" value={phone} onChange={(e) => setPhone(e.target.value)} className="w-full bg-gray-50 p-4 rounded-xl mb-6 text-center font-black text-xl outline-none border border-gray-200" placeholder="MOBILE NO." />
                        <button onClick={handleLogin} disabled={loading} className="w-full bg-blue-900 text-white font-black text-lg p-4 rounded-2xl active:scale-95 shadow-lg flex justify-center">
                            {loading ? <div className="border-4 border-white border-t-transparent w-7 h-7 rounded-full spinner"></div> : "SECURE LOGIN"}
                        </button>
                    </div>
                </div>
            );
        }

        function Catalog({ user, callAPI, cart, setCart, products, setProducts, setView, globalProps }) {
            const [loading, setLoading] = useState(products.length === 0);
            const [selectedType, setSelectedType] = useState(null);
            const [searchQuery, setSearchQuery] = useState("");
            const [typingTimer, setTypingTimer] = useState(null);
            const [selectedProduct, setSelectedProduct] = useState(null);

            useEffect(() => {
                if (products.length === 0) {
                    callAPI({ action: "getProducts" }).then(res => {
                        if (res && res.success) setProducts(res.data);
                        else alert("Data Error: Please check Sheet");
                        setLoading(false);
                    });
                }
            }, []);

            const updateQty = (product, change) => {
                if(globalProps.customerMode) return; 
                const updated = { ...cart };
                const stockVal = parseInt(product.Stock) || 0;
                const currentQty = updated[product.ItemCode] ? updated[product.ItemCode].qty : 0;
                const newQty = currentQty + change;
                if (newQty > stockVal) return alert("Maximum stock limit reached!");
                if (newQty <= 0) delete updated[product.ItemCode];
                else updated[product.ItemCode] = { ...product, qty: newQty };
                setCart(updated);
            };

            const cartItems = Object.values(cart);
            const totalItems = cartItems.reduce((a, b) => a + b.qty, 0);
            const totalAmount = cartItems.reduce((a, b) => a + (b.DealerPrice * b.qty), 0);

            if (loading) return <div className="flex flex-col justify-center items-center h-[70vh] text-blue-900"><div className="border-4 border-current border-t-transparent w-12 h-12 rounded-full spinner mb-4"></div><p className="font-bold">Syncing Inventory...</p></div>;

            const inStockProducts = products.filter(p => p.Stock && parseInt(p.Stock) > 0);

            const renderProducts = (productList) => (
                <div className="p-4 grid grid-cols-2 gap-4">
                    {productList.map(p => {
                        const currentQty = cart[p.ItemCode] ? cart[p.ItemCode].qty : 0;
                        const smartImg = getSmartImage(p);
                        
                        const mrpVal = Number(p.MRP);
                        const dealerVal = Number(p.DealerPrice);
                        const hasDiscount = !isNaN(mrpVal) && mrpVal > dealerVal;
                        const discountPercent = hasDiscount ? Math.round(((mrpVal - dealerVal) / mrpVal) * 100) : 0;

                        return (
                            <div key={p.ItemCode} className="bg-white rounded-2xl p-3 shadow-sm flex flex-col justify-between border border-gray-50 relative">
                                <div className="mt-1 cursor-pointer" onClick={() => setSelectedProduct(p)}>
                                    {smartImg ? <img src={smartImg} className="h-32 w-full object-contain mb-2 p-1" /> : <div className="h-32 bg-gray-50 rounded flex items-center justify-center text-gray-300 text-xs mb-2">No Image</div>}
                                    <h3 className="font-bold text-xs leading-snug line-clamp-2 h-8">{p.ProductName}</h3>
                                </div>
                                <div className="mt-3">
                                    {!globalProps.customerMode ? (
                                        <div>
                                            {hasDiscount ? (
                                                <div className="flex items-center gap-1.5 mb-1">
                                                    <span className="text-[10px] text-gray-400 font-bold line-through tracking-tight">MRP: ₹{p.MRP}</span>
                                                    <span className="text-[9px] bg-green-100 text-green-700 font-black px-1.5 py-0.5 rounded shadow-sm">{discountPercent}% OFF</span>
                                                </div>
                                            ) : (
                                                p.MRP && p.MRP !== "" && (
                                                    <div className="text-[10px] text-gray-400 font-bold line-through tracking-tight mb-1">MRP: ₹{p.MRP}</div>
                                                )
                                            )}
                                            <div className="font-black text-lg text-blue-900 mb-2 tracking-tight">₹{p.DealerPrice}</div>
                                            
                                            {currentQty > 0 ? (
                                                <div className="flex justify-between items-center bg-blue-50 rounded-xl p-1 border border-blue-100">
                                                    <button onClick={(e) => { e.stopPropagation(); updateQty(p, -1); }} className="bg-white text-blue-900 font-black w-8 h-8 rounded-lg shadow-sm">-</button>
                                                    <span className="font-black text-blue-900">{currentQty}</span>
                                                    <button onClick={(e) => { e.stopPropagation(); updateQty(p, 1); }} className="bg-blue-900 text-white font-black w-8 h-8 rounded-lg shadow-sm">+</button>
                                                </div>
                                            ) : (
                                                <button onClick={(e) => { e.stopPropagation(); updateQty(p, 1); }} className="w-full bg-gray-900 text-white text-xs font-bold py-3 rounded-xl shadow-sm">+ ADD</button>
                                            )}
                                        </div>
                                    ) : (
                                        <button onClick={(e) => {
                                            e.stopPropagation();
                                            const shareText = `🔥 Check out this item at our store!\n\n📦 *Product:* ${p.ProductName}\n⚡ *Brand:* ${p.Brand || 'Premium'}\n\n🏢 *Dealer:* ${user ? user.shopName : ''}\n📞 *Contact:* ${user ? user.phone : ''}\n\nAsk for the best price today!`;
                                            if (navigator.share) {
                                                navigator.share({ title: p.ProductName, text: shareText, url: smartImg }).catch(() => {});
                                            } else {
                                                window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(shareText + "\nImage: " + smartImg)}`, '_blank');
                                            }
                                            globalProps.logSpyData("Shared Product Image", p.ItemCode);
                                        }} className="w-full bg-green-600 hover:bg-green-700 text-white text-[11px] font-black py-3 rounded-xl shadow-sm flex items-center justify-center gap-1">
                                            📲 SHARE PHOTO
                                        </button>
                                    )}
                                </div>
                            </div>
                        );
                    })}
                </div>
            );

            const handleSearchChange = (e) => {
                const val = e.target.value;
                setSearchQuery(val);
                if(val !== "") setSelectedType(null);
                
                clearTimeout(typingTimer);
                if(val.length > 2) {
                    setTypingTimer(setTimeout(() => {
                        globalProps.logSpyData("Searched Item", val);
                    }, 1500));
                }
            };

            const searchBarUI = (
                <div className="p-3 bg-white sticky top-[62px] z-30 shadow-sm border-b flex items-center">
                    <input 
                        type="text" 
                        placeholder="Search products, brands..." 
                        value={searchQuery}
                        onChange={handleSearchChange}
                        className="w-full bg-gray-100 p-3 rounded-xl outline-none font-bold text-sm border border-gray-200 focus:border-blue-300 transition-colors"
                    />
                    {searchQuery && (
                        <button onClick={() => setSearchQuery("")} className="ml-2 bg-gray-200 text-gray-600 font-bold px-3 py-3 rounded-xl">✕</button>
                    )}
                </div>
            );

            let mainContent;

            if (searchQuery.trim() !== "") {
                const safeQuery = searchQuery.toLowerCase();
                const searchResults = inStockProducts.filter(p => 
                    (p.ProductName || "").toLowerCase().includes(safeQuery) || 
                    (p.Brand || "").toLowerCase().includes(safeQuery)
                );
                mainContent = searchResults.length > 0 ? renderProducts(searchResults) : <div className="p-8 text-center font-bold text-gray-400">No products found.</div>;
            } else if (!selectedType) {
                
                const priorityOrder = [
                    "SMART WATCH", "AIRPODS", "NECKBAND", "POWERBANK", 
                    "CABLE", "CHARGER", "HEADPHONE", "MEMORY CARD", "PENDRIVE"
                ];

                const types = [...new Set(inStockProducts.map(p => p.Type).filter(Boolean))].sort((a, b) => {
                    const indexA = priorityOrder.indexOf(a.toUpperCase().trim());
                    const indexB = priorityOrder.indexOf(b.toUpperCase().trim());
                    
                    if (indexA !== -1 && indexB !== -1) return indexA - indexB; 
                    if (indexA !== -1) return -1; 
                    if (indexB !== -1) return 1;  
                    return a.localeCompare(b);    
                });

                mainContent = (
                    <div className="p-4">
                        <h2 className="font-black text-gray-800 text-xl mb-4">Select Category</h2>
                        <div className="grid grid-cols-2 gap-4">
                            {types.map(type => {
                                const coverProduct = inStockProducts.find(p => p.Type === type);
                                const cover = coverProduct ? getSmartImage(coverProduct) : null;
                                return (
                                    <div key={type} onClick={() => {
                                        setSelectedType(type);
                                        globalProps.logSpyData("Viewed Category", type);
                                    }} className="bg-white rounded-2xl p-4 shadow-sm flex flex-col items-center justify-center cursor-pointer active:scale-95 h-40">
                                        {cover ? <img src={cover} className="h-16 object-contain mb-3" /> : <div className="text-3xl mb-3">📦</div>}
                                        <h3 className="font-extrabold text-sm text-center truncate w-full">{type}</h3>
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                );
            } else {
                const filteredProducts = inStockProducts.filter(p => p.Type === selectedType).sort((a, b) => Number(b.DealerPrice) - Number(a.DealerPrice));
                mainContent = (
                    <div>
                        <div className="p-4 bg-white bg-opacity-95 z-20 border-b flex justify-between items-center shadow-sm">
                            <button onClick={() => setSelectedType(null)} className="font-bold text-blue-900 bg-blue-50 px-3 py-1.5 rounded-lg border border-blue-100 shadow-sm">← Categories</button>
                            <span className="font-black text-gray-800">{selectedType}</span>
                        </div>
                        {renderProducts(filteredProducts)}
                    </div>
                );
            }

            return (
                <div className="flex flex-col">
                    {searchBarUI}
                    {mainContent}
                    {selectedProduct && (
                        <ProductDetailModal 
                            product={selectedProduct} 
                            onClose={() => setSelectedProduct(null)} 
                            cart={cart}
                            updateQty={updateQty}
                            user={user}
                            globalProps={globalProps}
                        />
                    )}
                    {totalItems > 0 && !globalProps.customerMode && <CartFooter totalItems={totalItems} totalAmount={totalAmount} setView={() => {
                        globalProps.logSpyData("Viewed Cart", `Items: ${totalItems}, Val: ₹${totalAmount}`);
                        setView("cart");
                    }} />}
                </div>
            );
        }

        function CartFooter({ totalItems, totalAmount, setView }) {
            return (
                <div className="fixed bottom-4 left-4 right-4 bg-green-600 text-white rounded-2xl shadow-2xl p-4 flex justify-between items-center z-50">
                    <div>
                        <div className="text-[10px] uppercase font-black opacity-80">{totalItems} Total Qty</div>
                        <div className="font-black text-lg leading-none">₹{totalAmount} Total</div>
                    </div>
                    <button onClick={setView} className="bg-white text-green-700 font-black px-6 py-2 rounded-xl shadow-md active:scale-95">VIEW CART →</button>
                </div>
            );
        }

        function Cart({ user, cart, setCart, setView, callAPI, globalProps }) {
            const [loading, setLoading] = useState(false);
            const [paymentMode, setPaymentMode] = useState(""); 
            const [screenshotUploaded, setScreenshotUploaded] = useState(false);
            const cartItems = Object.values(cart);
            const totalAmount = cartItems.reduce((acc, item) => acc + (item.DealerPrice * item.qty), 0);
            const discountAmount = paymentMode === 'UPI' ? Math.round(totalAmount * 0.02) : 0;
            const finalAmount = totalAmount - discountAmount;

            const handleCheckout = async () => {
                if (!paymentMode) return alert("Please select Payment Mode!");
                if (paymentMode === 'UPI' && !screenshotUploaded) return alert("Upload Payment Screenshot first!");
                setLoading(true);
                const itemsStr = cartItems.map(i => i.ProductName + " x" + i.qty).join(" | ");
                const res = await callAPI({ action: "placeOrder", order: { phone: user.phone, shopName: user.shopName, items: itemsStr, totalAmount, finalAmount, paymentMode }});
                setLoading(false);
                if (res.success) {
                    alert("✅ ORDER CONFIRMED!\n\nDear " + user.shopName + ",\nThank you for choosing Yash Marketing.\n\nOrder ID: " + res.orderId + "\nFinal Amount: ₹" + finalAmount + "\n\nWe will dispatch it shortly.");
                    globalProps.logSpyData("Order Placed", `ID: ${res.orderId}, Val: ₹${finalAmount}`);
                    setCart({}); setView("catalog");
                } else alert("Order failed.");
            };

            return (
                <div className="p-4 bg-gray-50 min-h-screen pb-40">
                    <div className="bg-white rounded-2xl shadow-sm border p-4 mb-6">
                        {cartItems.map(item => (
                            <div key={item.ItemCode} className="flex justify-between items-center border-b last:border-0 py-3">
                                <div className="w-2/3 pr-2">
                                    <h4 className="text-xs font-bold leading-tight">{item.ProductName}</h4>
                                    <div className="text-[10px] text-gray-500 mt-1 font-bold italic">₹{item.DealerPrice} × {item.qty} Qty</div>
                                </div>
                                <div className="font-black text-gray-900 text-sm">₹{item.DealerPrice * item.qty}</div>
                            </div>
                        ))}
                        <div className="flex justify-between items-center mt-3 pt-3 border-t-2 border-dashed border-gray-100">
                            <span className="font-bold text-gray-500 uppercase text-[10px]">Net Value</span>
                            <span className="font-black text-xl text-gray-900">₹{totalAmount}</span>
                        </div>
                    </div>

                    <h2 className="font-black text-gray-800 text-xl mb-4">Payment Options</h2>
                    <div className="space-y-3">
                        <div onClick={() => setPaymentMode('COD')} className={`p-4 rounded-2xl border-2 cursor-pointer transition-all ${paymentMode === 'COD' ? 'border-blue-600 bg-blue-50 shadow-md' : 'border-gray-200 bg-white'}`}>
                            <div className="font-black text-gray-800">Cash On Delivery (COD)</div>
                        </div>
                        <div onClick={() => setPaymentMode('UPI')} className={`p-4 rounded-2xl border-2 cursor-pointer transition-all ${paymentMode === 'UPI' ? 'border-green-600 bg-green-50 shadow-md' : 'border-gray-200 bg-white'}`}>
                            <div className="flex justify-between items-center">
                                <div className="font-black text-green-800 tracking-tight">UPI (2% CASH DISCOUNT)</div>
                                <div className="bg-red-500 text-white text-[8px] px-2 py-0.5 rounded font-black">EXTRA SAVINGS</div>
                            </div>
                            {paymentMode === 'UPI' && (
                                <div className="mt-4 bg-white p-4 rounded-xl border border-green-100 text-center">
                                    <p className="text-xs font-bold mb-3">Pay Exactly: <span className="text-green-600 text-xl font-black">₹{finalAmount}</span></p>
                                    <img src="https://upload.wikimedia.org/wikipedia/commons/d/d0/QR_code_for_mobile_English_Wikipedia.svg" className="w-32 h-32 mx-auto mb-4 border p-1" />
                                    <input type="file" accept="image/*" onChange={(e) => setScreenshotUploaded(true)} className="text-[10px]" />
                                </div>
                            )}
                        </div>
                        <div onClick={() => setPaymentMode('DAILY')} className={`p-4 rounded-2xl border-2 cursor-pointer transition-all ${paymentMode === 'DAILY' ? 'border-purple-600 bg-purple-50 shadow-md' : 'border-gray-200 bg-white'}`}>
                            <div className="font-black text-purple-900">Daily Collection (Auto-Pay)</div>
                            {paymentMode === 'DAILY' && (
                                <div className="mt-4 rounded-xl overflow-hidden shadow-inner border border-purple-100">
                                    <iframe width="100%" height="180" src="https://www.youtube.com/embed/tgbNymZ7vqY" frameBorder="0" allowFullScreen></iframe>
                                </div>
                            )}
                        </div>
                    </div>

                    <div className="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white border-t p-5 rounded-t-3xl shadow-2xl z-50">
                        <div className="flex justify-between items-center mb-1 text-[10px] font-bold text-gray-400 uppercase">
                            <span>Subtotal</span>
                            <span className="line-through">₹{totalAmount}</span>
                        </div>
                        <div className="flex justify-between items-center mb-4">
                            <span className="font-black text-gray-800 text-lg">Final Amount</span>
                            <span className="text-blue-900 text-2xl font-black">₹{finalAmount}</span>
                        </div>
                        <button onClick={handleCheckout} disabled={loading} className={`w-full text-white font-black text-lg py-4 rounded-2xl shadow-lg active:scale-95 flex justify-center items-center ${!paymentMode ? 'bg-gray-300' : 'bg-blue-900'}`}>
                            {loading ? <div className="border-4 border-white border-t-transparent w-6 h-6 rounded-full spinner"></div> : "CONFIRM ORDER"}
                        </button>
                    </div>
                </div>
            );
        }

        function LedgerView({ user, callAPI }) {
            const [ledgerData, setLedgerData] = useState([]);
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                callAPI({ action: "getLedger", phone: user.phone }).then(res => {
                    if (res && res.success) {
                        setLedgerData(res.data);
                    } else {
                        alert(res.message || "Ledger statement aane me dukan ki info match nahi hui.");
                    }
                    setLoading(false);
                });
            }, []);

            if (loading) return (
                <div className="flex flex-col justify-center items-center h-[70vh] text-blue-900">
                    <div className="border-4 border-current border-t-transparent w-12 h-12 rounded-full spinner mb-4"></div>
                    <p className="font-bold">Generating Ledger Statement...</p>
                </div>
            );

            let totalDebit = 0;
            let totalCredit = 0;
            ledgerData.forEach(item => {
                totalDebit += item.debit || 0;
                totalCredit += item.credit || 0;
            });
            const netBalance = totalDebit - totalCredit;

            return (
                <div className="p-4 bg-gray-50 min-h-screen pb-24">
                    <div className="bg-white rounded-2xl shadow-sm border p-4 mb-4">
                        <h2 className="font-black text-gray-800 text-lg mb-1">Account Summary</h2>
                        <p className="text-xs text-gray-400 mb-4 uppercase font-bold">Outstanding Balance</p>
                        
                        <div className="grid grid-cols-3 gap-2 text-center">
                            <div className="bg-red-50 p-3 rounded-xl border border-red-100">
                                <div className="text-[9px] text-red-600 font-bold uppercase">Total Bills</div>
                                <div className="font-black text-red-900 text-sm mt-1">₹{Math.round(totalDebit).toLocaleString('en-IN')}</div>
                            </div>
                            <div className="bg-green-50 p-3 rounded-xl border border-green-100">
                                <div className="text-[9px] text-green-600 font-bold uppercase">Total Paid</div>
                                <div className="font-black text-green-900 text-sm mt-1">₹{Math.round(totalCredit).toLocaleString('en-IN')}</div>
                            </div>
                            <div className="bg-blue-50 p-3 rounded-xl border border-blue-100">
                                <div className="text-[9px] text-blue-600 font-bold uppercase">Outstanding</div>
                                <div className="font-black text-blue-900 text-sm mt-1">₹{Math.round(netBalance).toLocaleString('en-IN')}</div>
                            </div>
                        </div>
                    </div>

                    <h3 className="font-black text-gray-800 text-md mb-3 px-1">Ledger Entries</h3>
                    <div className="space-y-3">
                        {ledgerData.length === 0 ? (
                            <div className="text-center p-8 bg-white rounded-2xl border text-gray-400 font-bold">Koi ledger record nahi mila.</div>
                        ) : (
                            ledgerData.map((item, index) => {
                                const isDebit = item.debit > 0;
                                return (
                                    <div key={index} className="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 flex justify-between items-start">
                                        <div className="w-2/3">
                                            <div className="text-[10px] text-gray-400 font-bold">{item.date}</div>
                                            <h4 className="text-xs font-black text-gray-800 mt-1 leading-snug">{item.particulars}</h4>
                                            {item.vchType && (
                                                <div className="flex gap-1.5 mt-1.5">
                                                    <span className="bg-gray-100 text-gray-600 font-bold text-[8px] px-1.5 py-0.5 rounded uppercase">{item.vchType}</span>
                                                    {item.vchNo && <span className="bg-blue-50 text-blue-600 font-bold text-[8px] px-1.5 py-0.5 rounded">No: {item.vchNo}</span>}
                                                </div>
                                            )}
                                        </div>
                                        <div className="text-right">
                                            {isDebit ? (
                                                <div>
                                                    <div className="text-xs text-red-500 font-bold">DR (Debited)</div>
                                                    <div className="font-black text-red-600 text-base mt-0.5">₹{Math.round(item.debit).toLocaleString('en-IN')}</div>
                                                </div>
                                            ) : (
                                                <div>
                                                    <div className="text-xs text-green-500 font-bold">CR (Credited)</div>
                                                    <div className="font-black text-green-600 text-base mt-0.5">₹{Math.round(item.credit).toLocaleString('en-IN')}</div>
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                );
                            })
                        )}
                    </div>
                </div>
            );
        }

        // =====================================================================
        // NEW FEATURE COMPONENT: PRODUCT DETAIL MODAL (SLIDE-UP OVERLAY)
        // =====================================================================
        function ProductDetailModal({ product, onClose, cart, updateQty, user, globalProps }) {
            const [currentImgIndex, setCurrentImgIndex] = useState(0);
            const [imagesList, setImagesList] = useState([]);
            const currentQty = cart[product.ItemCode] ? cart[product.ItemCode].qty : 0;
            
            useEffect(() => {
                const list = [];
                const mainImg = getSmartImage(product);
                
                // Pure Image detection: Webpage URLs are skipped instantly to avoid broken frames
                const isWebpage = mainImg && (mainImg.includes("/products/") || mainImg.includes("/pages/") || mainImg.includes("boat-lifestyle.com/products") || mainImg.includes("portronics.com/products"));
                
                if (mainImg && !isWebpage) {
                    list.push(mainImg);
                }
                
                if (product.MoreImages && product.MoreImages.trim() !== "") {
                    const extraImages = product.MoreImages.split(" | ").map(img => img.trim());
                    extraImages.forEach(img => {
                        if (img !== "") list.push(img);
                    });
                }

                // Placeholder fallback
                if (list.length === 0) {
                    list.push("https://ui-avatars.com/api/?name=Yash+Marketing&background=f3f4f6&color=1e3a8a&size=200&bold=true");
                }
                setImagesList(list);
            }, [product]);

            const featuresList = [];
            if (product.Features && product.Features.trim() !== "") {
                const parsed = product.Features.split(" | ").map(f => f.trim());
                parsed.forEach(f => {
                    if (f !== "") featuresList.push(f);
                });
            }

            const mrpVal = Number(product.MRP);
            const dealerVal = Number(product.DealerPrice);
            const hasDiscount = !isNaN(mrpVal) && mrpVal > dealerVal;
            const discountPercent = hasDiscount ? Math.round(((mrpVal - dealerVal) / mrpVal) * 100) : 0;

            const handleNextImage = () => {
                setCurrentImgIndex((prev) => (prev + 1) % imagesList.length);
            };

            const handlePrevImage = () => {
                setCurrentImgIndex((prev) => (prev - 1 + imagesList.length) % imagesList.length);
            };

            if (imagesList.length === 0) return null;

            return (
                <div className="fixed inset-0 bg-black bg-opacity-60 z-50 flex items-end justify-center">
                    <div className="absolute inset-0" onClick={onClose}></div>
                    <div className="bg-white w-full max-w-md rounded-t-3xl overflow-hidden max-h-[88vh] flex flex-col animate-slide-up shadow-2xl relative z-10">
                        
                        <div className="w-12 h-1.5 bg-gray-300 rounded-full mx-auto my-3 cursor-pointer" onClick={onClose}></div>
                        
                        <button onClick={onClose} className="absolute right-5 top-3 bg-gray-100 text-gray-700 font-extrabold w-8 h-8 rounded-full flex items-center justify-center shadow-sm hover:bg-gray-200 z-20">✕</button>
                        
                        <div className="overflow-y-auto no-scrollbar pb-32">
                            <div className="relative bg-white p-4 flex items-center justify-center border-b border-gray-100 h-64 select-none">
                                <img 
                                    src={imagesList[currentImgIndex]} 
                                    className="h-56 max-w-full object-contain" 
                                    onError={(e) => {
                                        // Self-healing check: Removes bad image immediately without showing a broken frame
                                        if (imagesList.length > 1) {
                                            const updatedList = imagesList.filter((_, idx) => idx !== currentImgIndex);
                                            setImagesList(updatedList);
                                            setCurrentImgIndex(0);
                                        } else {
                                            e.target.src = "https://ui-avatars.com/api/?name=Yash+Marketing&background=f3f4f6&color=1e3a8a&size=200&bold=true";
                                        }
                                    }}
                                />
                                
                                {imagesList.length > 1 && (
                                    <React.Fragment>
                                        <button onClick={handlePrevImage} className="absolute left-3 bg-white bg-opacity-95 text-gray-800 font-black p-2.5 rounded-full shadow-md hover:bg-gray-50">←</button>
                                        <button onClick={handleNextImage} className="absolute right-3 bg-white bg-opacity-95 text-gray-800 font-black p-2.5 rounded-full shadow-md hover:bg-gray-50">→</button>
                                        
                                        <div className="absolute bottom-3 flex gap-1.5 justify-center w-full">
                                            {imagesList.map((_, idx) => (
                                                <div key={idx} className={`h-2 rounded-full transition-all ${idx === currentImgIndex ? 'w-5 bg-blue-900' : 'w-2 bg-gray-300'}`}></div>
                                            ))}
                                        </div>
                                    </React.Fragment>
                                )}
                            </div>

                            <div className="p-5">
                                <span className="text-[10px] bg-blue-50 text-blue-900 font-black px-2.5 py-1 rounded-full uppercase tracking-wider">{product.Brand || 'Premium Brand'}</span>
                                <h2 className="text-lg font-black text-gray-900 mt-2 leading-tight">{product.ProductName}</h2>
                                <p className="text-xs text-gray-400 font-bold mt-1 uppercase">Category: {product.Type || 'Accessories'}</p>

                                {!globalProps.customerMode ? (
                                    <div className="mt-4 bg-gray-50 p-4 rounded-2xl border border-gray-100">
                                        <div className="text-xs text-gray-400 font-bold uppercase tracking-wider">Dealer Price</div>
                                        <div className="flex items-baseline gap-2.5 mt-1">
                                            <span className="text-3xl font-black text-blue-950">₹{product.DealerPrice}</span>
                                            {hasDiscount && (
                                                <React.Fragment>
                                                    <span className="text-xs text-gray-400 line-through font-bold">MRP: ₹{product.MRP}</span>
                                                    <span className="text-[10px] bg-green-100 text-green-700 font-black px-2 py-0.5 rounded shadow-sm">{discountPercent}% OFF</span>
                                                </React.Fragment>
                                            )}
                                        </div>
                                        <div className="text-[10px] text-green-600 font-bold mt-2 flex items-center gap-1">
                                            <span>📦</span> In Stock Status: {product.Stock || 'Available'} units
                                        </div>
                                    </div>
                                ) : (
                                    <div className="mt-4 bg-green-50 p-4 rounded-2xl border border-green-100">
                                        <div className="text-xs text-green-800 font-black uppercase tracking-wider">Offer MRP</div>
                                        <div className="text-3xl font-black text-green-950 mt-1">₹{product.MRP || 'Contact store'}</div>
                                    </div>
                                )}

                                <div className="mt-6">
                                    <h3 className="font-extrabold text-sm text-gray-900 mb-3 tracking-wide uppercase">Product Key Highlights</h3>
                                    {featuresList.length === 0 ? (
                                        <p className="text-xs text-gray-500 font-bold italic leading-relaxed">High-performance authentic build quality with official brand warranty check. Contact us for direct bulk details.</p>
                                    ) : (
                                        <ul className="space-y-2.5">
                                            {featuresList.map((f, i) => (
                                                <li key={i} className="text-xs text-gray-700 font-bold flex items-start gap-2 leading-snug">
                                                    <span className="text-green-600 text-sm leading-none mt-0.5">⚡</span>
                                                    <span>{f}</span>
                                                </li>
                                            ))}
                                        </ul>
                                    )}
                                </div>
                            </div>
                        </div>

                        <div className="absolute bottom-0 left-0 right-0 bg-white border-t p-4 flex justify-between items-center z-30 shadow-inner">
                            {!globalProps.customerMode ? (
                                <React.Fragment>
                                    <div>
                                        <div className="text-[9px] uppercase font-black text-gray-400">Total Selection</div>
                                        <div className="font-black text-lg text-gray-900 leading-none mt-0.5">₹{product.DealerPrice * (currentQty || 1)}</div>
                                    </div>
                                    
                                    <div className="w-1/2">
                                        {currentQty > 0 ? (
                                            <div className="flex justify-between items-center bg-blue-50 rounded-xl p-1 border border-blue-100">
                                                <button onClick={() => updateQty(product, -1)} className="bg-white text-blue-900 font-black w-10 h-10 rounded-lg shadow-sm">-</button>
                                                <span className="font-black text-blue-900 text-lg">{currentQty}</span>
                                                <button onClick={() => updateQty(product, 1)} className="bg-blue-900 text-white font-black w-10 h-10 rounded-lg shadow-sm">+</button>
                                            </div>
                                        ) : (
                                            <button onClick={() => updateQty(product, 1)} className="w-full bg-blue-900 text-white text-xs font-black py-4 rounded-xl shadow-lg active:scale-95">Add To Order</button>
                                        )}
                                    </div>
                                </React.Fragment>
                            ) : (
                                <button onClick={() => {
                                    const shareText = `🔥 Check out this item at our store!\n\n📦 *Product:* ${product.ProductName}\n⚡ *Brand:* ${product.Brand || 'Premium'}\n\n🏢 *Dealer:* ${user ? user.shopName : ''}\n📞 *Contact:* ${user ? user.phone : ''}\n\nAsk for the best price today!`;
                                    if (navigator.share) {
                                        navigator.share({ title: product.ProductName, text: shareText, url: imagesList[0] }).catch(() => {});
                                    } else {
                                        window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(shareText + "\nImage: " + imagesList[0])}`, '_blank');
                                    }
                                }} className="w-full bg-green-600 hover:bg-green-700 text-white text-sm font-black py-4 rounded-xl shadow-lg flex items-center justify-center gap-1.5 active:scale-95">
                                    📲 SHARE PHOTO WITH DEALER
                                </button>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
