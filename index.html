<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Yash Marketing</title>
    
    <meta name="apple-mobile-web-app-title" content="Yash Marketing">
    <meta name="application-name" content="Yash Marketing">
    <link rel="icon" href="https://ui-avatars.com/api/?name=Yash+Marketing&background=1e3a8a&color=fff&rounded=true&bold=true">
    <link rel="apple-touch-icon" href="https://ui-avatars.com/api/?name=Yash+Marketing&background=1e3a8a&color=fff&size=180&bold=true">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <style>
        body { -webkit-tap-highlight-color: transparent; }
        .spinner { border-top-color: #3498db; animation: spinner 1.5s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .glass-panel { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const API_URL = "https://script.google.com/macros/s/AKfycby8jvTFCTpt7q4lvMmdmwL7kiVTv6SPpgtqqZZLaiUiIdhGViEq8sLtqJjhIPT7403Uag/exec";
        const LOGO_URL = "https://ui-avatars.com/api/?name=Yash+Marketing&background=1e3a8a&color=fff&size=256&rounded=true&bold=true";

        function App() {
            const [user, setUser] = useState(null);
            const [view, setView] = useState("catalog"); 
            const [products, setProducts] = useState([]);
            const [cart, setCart] = useState({});
            const [loading, setLoading] = useState(false);

            const callAPI = async (payload) => {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload),
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                });
                return await response.json();
            };

            if (!user) {
                return <LoginScreen onLogin={setUser} callAPI={callAPI} loading={loading} setLoading={setLoading} />;
            }

            return (
                <div className="max-w-md mx-auto bg-gray-100 min-h-screen relative pb-20 shadow-xl">
                    {/* Branded Header */}
                    <div className="bg-blue-900 text-white p-4 sticky top-0 z-30 flex justify-between items-center shadow-md">
                        <div>
                            <h1 className="font-extrabold text-lg leading-tight flex items-center gap-2 tracking-wide">
                                <img src={LOGO_URL} alt="Logo" className="w-7 h-7 rounded-full border border-blue-400" />
                                Yash Marketing
                            </h1>
                            <p className="text-[10px] text-blue-200 font-bold tracking-widest uppercase mt-1">{user.shopName}</p>
                        </div>
                        <button onClick={() => setView(view === "catalog" ? "cart" : "catalog")} className="relative bg-blue-800 p-2.5 rounded-xl font-bold transition-transform active:scale-95 shadow-inner">
                            {view === "catalog" ? "🛒 Cart" : "📦 Store"}
                            {Object.keys(cart).length > 0 && (
                                <span className="absolute -top-2 -right-2 bg-red-500 text-white text-[10px] px-2 py-0.5 rounded-full font-black shadow-md border-2 border-blue-900">
                                    {Object.values(cart).reduce((a, b) => a + b.qty, 0)}
                                </span>
                            )}
                        </button>
                    </div>

                    {view === "catalog" 
                        ? <Catalog callAPI={callAPI} cart={cart} setCart={setCart} products={products} setProducts={setProducts} /> 
                        : <Cart user={user} cart={cart} setCart={setCart} setView={setView} callAPI={callAPI} />
                    }
                </div>
            );
        }

        function LoginScreen({ onLogin, callAPI, loading, setLoading }) {
            const [phone, setPhone] = useState("");
            
            const handleLogin = async () => {
                if(phone.length < 10) return alert("Please enter a valid 10-digit number");
                setLoading(true);
                const res = await callAPI({ action: "verifyDealer", phone: phone });
                setLoading(false);
                
                if (res.success) onLogin({ phone, shopName: res.shopName });
                else alert(res.message);
            };

            return (
                <div className="flex flex-col items-center justify-center min-h-screen bg-gray-100 p-6">
                    <div className="bg-white p-8 rounded-3xl shadow-2xl w-full max-w-sm text-center border-t-8 border-blue-900">
                        <img src={LOGO_URL} alt="Yash Marketing Logo" className="w-24 h-24 mx-auto mb-4 drop-shadow-xl rounded-full border-4 border-gray-50" />
                        <h2 className="text-3xl font-black mb-1 text-gray-900">Yash Marketing</h2>
                        <p className="text-blue-700 font-bold text-xs mb-8 tracking-widest uppercase bg-blue-50 py-1 px-3 rounded-full inline-block">Authorized Dealer Portal</p>
                        
                        <div className="bg-gray-50 p-4 rounded-2xl mb-6 shadow-inner border border-gray-100">
                            <input type="tel" value={phone} onChange={(e) => setPhone(e.target.value)} 
                                className="w-full bg-transparent p-2 text-center font-black text-2xl tracking-widest focus:outline-none text-gray-800 placeholder-gray-300" 
                                placeholder="MOBILE NO." />
                        </div>
                        
                        <button onClick={handleLogin} disabled={loading} 
                            className="w-full bg-blue-900 text-white font-black text-lg p-4 rounded-2xl active:scale-95 transition-transform flex justify-center shadow-lg hover:bg-blue-800">
                            {loading ? <div className="border-4 border-blue-300 border-t-white w-7 h-7 rounded-full spinner"></div> : "SECURE LOGIN"}
                        </button>
                    </div>
                </div>
            );
        }

        function Catalog({ callAPI, cart, setCart, products, setProducts }) {
            const [loading, setLoading] = useState(products.length === 0);
            const [selectedType, setSelectedType] = useState(null);

            useEffect(() => {
                if (products.length === 0) {
                    callAPI({ action: "getProducts" }).then(res => {
                        if (res.success) setProducts(res.data);
                        setLoading(false);
                    });
                }
            }, []);

            const addToCart = (product) => {
                const currentQty = cart[product.ItemCode] ? cart[product.ItemCode].qty : 0;
                
                // Inventory Logic Check
                if (currentQty >= parseInt(product.Stock)) {
                    return alert(`Only ${product.Stock} units available in stock!`);
                }

                const updated = { ...cart };
                if (updated[product.ItemCode]) updated[product.ItemCode].qty += 1;
                else updated[product.ItemCode] = { ...product, qty: 1 };
                setCart(updated);
            };

            if (loading) return <div className="flex flex-col justify-center items-center h-[70vh]"><div className="border-4 border-blue-900 border-t-transparent w-12 h-12 rounded-full spinner mb-4"></div><p className="font-bold text-gray-500 animate-pulse">Syncing Live Inventory...</p></div>;

            // Strict Inventory Filter: Only show items where Stock is greater than 0
            const inStockProducts = products.filter(p => p.Stock && parseInt(p.Stock) > 0);

            // Level 1: Category/Type View
            if (!selectedType) {
                // Get unique types from in-stock products
                const types = [...new Set(inStockProducts.map(p => p.Type).filter(Boolean))];

                return (
                    <div className="p-4">
                        <h2 className="font-black text-gray-800 text-xl mb-4 px-1">Select Category</h2>
                        <div className="grid grid-cols-2 gap-4">
                            {types.map(type => {
                                // Find the first product of this type to use its image as cover
                                const coverProduct = inStockProducts.find(p => p.Type === type && p.ImageURL);
                                const coverImage = coverProduct ? coverProduct.ImageURL : "";

                                return (
                                    <div key={type} onClick={() => setSelectedType(type)} 
                                        className="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 flex flex-col items-center justify-center cursor-pointer active:scale-95 transition-transform hover:shadow-md h-40 relative overflow-hidden group">
                                        {coverImage ? (
                                            <img src={coverImage} className="h-20 object-contain mb-3 group-hover:scale-110 transition-transform duration-300" alt={type} />
                                        ) : (
                                            <div className="h-20 w-full bg-blue-50 rounded-xl mb-3 flex items-center justify-center text-blue-200 text-3xl">📦</div>
                                        )}
                                        <h3 className="font-extrabold text-gray-900 text-center text-sm w-full truncate bg-white rounded px-1">{type}</h3>
                                    </div>
                                );
                            })}
                        </div>
                        {types.length === 0 && <div className="text-center p-10 text-gray-500 font-bold">No stock available currently.</div>}
                    </div>
                );
            }

            // Level 2: Product View (Sorted High to Low Price)
            const filteredProducts = inStockProducts
                .filter(p => p.Type === selectedType)
                .sort((a, b) => Number(b.DealerPrice) - Number(a.DealerPrice)); // Decreasing Price Sort

            return (
                <div className="flex flex-col">
                    <div className="p-4 sticky top-[72px] glass-panel z-10 border-b">
                        <button onClick={() => setSelectedType(null)} className="flex items-center text-blue-900 font-extrabold bg-blue-50 px-4 py-2 rounded-xl active:scale-95 transition-transform shadow-sm">
                            <span className="mr-2">←</span> Back to Categories
                        </button>
                    </div>

                    <div className="p-4 grid grid-cols-2 gap-4">
                        {filteredProducts.map(p => (
                            <div key={p.ItemCode} className="bg-white rounded-2xl border border-gray-100 p-3 flex flex-col justify-between shadow-sm relative overflow-hidden">
                                
                                {/* Stock Indicator Badge */}
                                <div className="absolute top-2 right-2 bg-green-100 text-green-700 text-[9px] font-black px-2 py-1 rounded-full shadow-sm border border-green-200">
                                    {p.Stock} IN STOCK
                                </div>

                                <div className="mt-4">
                                    {p.ImageURL ? <img src={p.ImageURL} className="h-28 w-full object-contain mb-3 p-1" alt={p.ProductName}/> 
                                                : <div className="h-28 w-full bg-gray-50 rounded-xl mb-3 flex items-center justify-center text-gray-300 text-xs border border-dashed">No Image</div>}
                                    <span className="text-[10px] bg-gray-100 text-gray-700 px-2 py-1 rounded font-extrabold uppercase tracking-wider">{p.Brand}</span>
                                    <h3 className="font-bold text-sm mt-2 leading-snug text-gray-800 line-clamp-2">{p.ProductName}</h3>
                                </div>
                                
                                <div className="mt-4">
                                    {p.MRP && <div className="text-[11px] text-gray-400 line-through mb-0.5 font-semibold">MRP: ₹{p.MRP}</div>}
                                    <div className="font-black text-xl text-blue-900 mb-3 tracking-tight">₹{p.DealerPrice}</div>
                                    <button onClick={() => addToCart(p)} className="w-full bg-gray-900 text-white text-sm font-bold py-3 rounded-xl active:scale-95 transition-transform shadow-md hover:bg-gray-800">
                                        + ADD TO CART
                                    </button>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        function Cart({ user, cart, setCart, setView, callAPI }) {
            const [loading, setLoading] = useState(false);
            const cartItems = Object.values(cart);
            const totalAmount = cartItems.reduce((acc, item) => acc + (item.DealerPrice * item.qty), 0);

            const handleCheckout = async () => {
                if (cartItems.length === 0) return;
                setLoading(true);
                const itemsStr = cartItems.map(i => `${i.ProductName} (${i.ItemCode}) x${i.qty}`).join(" | ");
                const orderData = { phone: user.phone, shopName: user.shopName, items: itemsStr, totalAmount: totalAmount };
                
                const res = await callAPI({ action: "placeOrder", order: orderData });
                setLoading(false);
                
                if (res.success) {
                    alert(`✅ Order Confirmed!\n\nOrder ID: ${res.orderId}\nWe will dispatch it shortly.`);
                    setCart({});
                    setView("catalog");
                } else {
                    alert("Order failed. Please try again.");
                }
            };

            if (cartItems.length === 0) return (
                <div className="flex flex-col items-center justify-center h-[60vh]">
                    <div className="text-6xl mb-4">🛒</div>
                    <div className="text-gray-400 font-bold text-lg">Cart is empty</div>
                    <button onClick={() => setView("catalog")} className="mt-6 bg-blue-50 text-blue-900 font-extrabold px-6 py-3 rounded-xl">Start Shopping</button>
                </div>
            );

            return (
                <div className="p-4 bg-gray-100 min-h-screen">
                    <h2 className="font-black text-gray-800 text-xl mb-4 px-1">Review Order</h2>
                    <div className="bg-white rounded-2xl shadow-sm border border-gray-100 p-2 mb-32">
                        {cartItems.map(item => (
                            <div key={item.ItemCode} className="flex justify-between items-center border-b border-gray-50 last:border-0 p-4">
                                <div className="w-2/3 pr-2">
                                    <h4 className="text-sm font-bold text-gray-800 leading-tight mb-1">{item.ProductName}</h4>
                                    <div className="text-xs text-gray-500 font-medium">₹{item.DealerPrice} <span className="mx-1">×</span> <span className="bg-blue-100 text-blue-900 px-2 py-0.5 rounded-full font-black">{item.qty} Qty</span></div>
                                </div>
                                <div className="font-extrabold text-gray-900 text-right text-lg">
                                    ₹{item.DealerPrice * item.qty}
                                    <div className="text-[10px] text-red-400 font-bold mt-1 cursor-pointer active:scale-95 uppercase tracking-wide" onClick={() => {
                                        const updated = {...cart};
                                        delete updated[item.ItemCode];
                                        setCart(updated);
                                    }}>Remove</div>
                                </div>
                            </div>
                        ))}
                    </div>
                    
                    <div className="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white border-t border-gray-100 shadow-[0_-15px_25px_-5px_rgba(0,0,0,0.05)] p-5 z-20 rounded-t-3xl">
                        <div className="flex justify-between items-center mb-4 text-gray-800">
                            <span className="font-bold text-gray-500">Total Order Value</span>
                            <span className="text-green-600 text-2xl font-black">₹{totalAmount}</span>
                        </div>
                        <button onClick={handleCheckout} disabled={loading} className="w-full bg-blue-900 text-white font-black text-lg py-4 rounded-2xl shadow-xl active:scale-95 flex justify-center items-center hover:bg-blue-800 transition-colors">
                            {loading ? <div className="border-4 border-blue-400 border-t-white w-6 h-6 rounded-full spinner"></div> : "CONFIRM ORDER"}
                        </button>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
