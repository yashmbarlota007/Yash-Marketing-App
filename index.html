<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>B2B Wholesale Portal</title>
    <!-- Modern Styling Engine -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React Engine -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <style>
        /* Custom UI Tweaks for Mobile First */
        body { -webkit-tap-highlight-color: transparent; }
        .spinner { border-top-color: #3498db; animation: spinner 1.5s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Aapka Google Apps Script URL
        const API_URL = "https://script.google.com/macros/s/AKfycby8jvTFCTpt7q4lvMmdmwL7kiVTv6SPpgtqqZZLaiUiIdhGViEq8sLtqJjhIPT7403Uag/exec";

        function App() {
            // App State Memory
            const [user, setUser] = useState(null);
            const [view, setView] = useState("catalog"); // 'catalog' or 'cart'
            const [products, setProducts] = useState([]);
            const [cart, setCart] = useState({});
            const [loading, setLoading] = useState(false);

            // API Calling Core Logic (Using text/plain to bypass CORS)
            const callAPI = async (payload) => {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload),
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                });
                return await response.json();
            };

            // Login Screen Component
            if (!user) {
                return <LoginScreen onLogin={(userData) => setUser(userData)} callAPI={callAPI} loading={loading} setLoading={setLoading} />;
            }

            // Main App Container
            return (
                <div className="max-w-md mx-auto bg-white min-h-screen relative pb-20 shadow-lg">
                    {/* Header */}
                    <div className="bg-gray-900 text-white p-4 sticky top-0 z-10 flex justify-between items-center">
                        <div>
                            <h1 className="font-bold text-lg leading-tight">Yash Wholesale</h1>
                            <p className="text-xs text-gray-400 font-medium tracking-wide uppercase">{user.shopName}</p>
                        </div>
                        <button onClick={() => setView(view === "catalog" ? "cart" : "catalog")} className="relative bg-gray-800 p-2 rounded-lg">
                            {view === "catalog" ? "🛒 Cart" : "📦 Catalog"}
                            {Object.keys(cart).length > 0 && (
                                <span className="absolute -top-1 -right-1 bg-red-500 text-white text-xs px-2 py-0.5 rounded-full font-bold">
                                    {Object.values(cart).reduce((a, b) => a + b.qty, 0)}
                                </span>
                            )}
                        </button>
                    </div>

                    {/* Dynamic View Routing */}
                    {view === "catalog" 
                        ? <Catalog callAPI={callAPI} cart={cart} setCart={setCart} products={products} setProducts={setProducts} /> 
                        : <Cart user={user} cart={cart} setCart={setCart} setView={setView} callAPI={callAPI} />
                    }
                </div>
            );
        }

        // --- SUB-COMPONENTS ---

        function LoginScreen({ onLogin, callAPI, loading, setLoading }) {
            const [phone, setPhone] = useState("");
            
            const handleLogin = async () => {
                if(phone.length < 10) return alert("Please enter valid 10-digit number");
                setLoading(true);
                const res = await callAPI({ action: "verifyDealer", phone: phone });
                setLoading(false);
                
                if (res.success) {
                    onLogin({ phone, shopName: res.shopName });
                } else {
                    alert(res.message);
                }
            };

            return (
                <div className="flex flex-col items-center justify-center min-h-screen bg-gray-100 p-6">
                    <div className="bg-white p-8 rounded-xl shadow-md w-full max-w-sm text-center">
                        <div className="w-16 h-16 bg-blue-600 rounded-full flex items-center justify-center mx-auto mb-4 text-white text-2xl">📦</div>
                        <h2 className="text-2xl font-bold mb-2">Dealer Login</h2>
                        <p className="text-gray-500 text-sm mb-6">Enter your registered WhatsApp number.</p>
                        
                        <input type="tel" value={phone} onChange={(e) => setPhone(e.target.value)} 
                            className="w-full border-2 border-gray-200 p-3 rounded-lg mb-4 font-bold text-center text-lg focus:border-blue-500 outline-none" 
                            placeholder="Mobile Number" />
                        
                        <button onClick={handleLogin} disabled={loading} 
                            className="w-full bg-blue-600 text-white font-bold p-3 rounded-lg active:scale-95 transition-transform flex justify-center">
                            {loading ? <div className="border-2 border-white w-6 h-6 rounded-full spinner"></div> : "Secure Access"}
                        </button>
                    </div>
                </div>
            );
        }

        function Catalog({ callAPI, cart, setCart, products, setProducts }) {
            const [loading, setLoading] = useState(products.length === 0);

            useEffect(() => {
                if (products.length === 0) {
                    callAPI({ action: "getProducts" }).then(res => {
                        if (res.success) setProducts(res.data);
                        setLoading(false);
                    });
                }
            }, []);

            const addToCart = (product) => {
                const updated = { ...cart };
                if (updated[product.ItemCode]) {
                    updated[product.ItemCode].qty += 1;
                } else {
                    updated[product.ItemCode] = { ...product, qty: 1 };
                }
                setCart(updated);
            };

            if (loading) return <div className="p-10 text-center text-gray-500">Loading live catalogue...</div>;

            return (
                <div className="p-4 grid grid-cols-2 gap-4">
                    {products.map(p => (
                        <div key={p.ItemCode} className="bg-white rounded-lg border p-3 flex flex-col justify-between shadow-sm">
                            <div>
                                {p.ImageURL && <img src={p.ImageURL} className="h-24 w-full object-contain mb-2" alt={p.ProductName}/>}
                                <span className="text-[10px] bg-gray-200 px-2 py-1 rounded text-gray-700 font-bold uppercase">{p.Brand}</span>
                                <h3 className="font-semibold text-sm mt-1 leading-tight">{p.ProductName}</h3>
                            </div>
                            <div className="mt-3">
                                <div className="font-bold text-lg text-blue-600 mb-2">₹{p.DealerPrice}</div>
                                <button onClick={() => addToCart(p)} className="w-full bg-gray-900 text-white text-xs font-bold py-2 rounded">
                                    + ADD
                                </button>
                            </div>
                        </div>
                    ))}
                </div>
            );
        }

        function Cart({ user, cart, setCart, setView, callAPI }) {
            const [loading, setLoading] = useState(false);
            const cartItems = Object.values(cart);
            const totalAmount = cartItems.reduce((acc, item) => acc + (item.DealerPrice * item.qty), 0);

            const handleCheckout = async () => {
                if (cartItems.length === 0) return;
                setLoading(true);
                
                // Format for Tally Column (e.g. "ItemA x2, ItemB x5")
                const itemsStr = cartItems.map(i => `${i.ProductName} (${i.ItemCode}) x${i.qty}`).join(" | ");

                const orderData = { phone: user.phone, shopName: user.shopName, items: itemsStr, totalAmount: totalAmount };
                const res = await callAPI({ action: "placeOrder", order: orderData });
                
                setLoading(false);
                if (res.success) {
                    alert("Order Placed Successfully! Order ID: " + res.orderId);
                    setCart({});
                    setView("catalog");
                } else {
                    alert("Order failed. Please try again.");
                }
            };

            if (cartItems.length === 0) return <div className="p-10 text-center text-gray-500 font-medium">Cart is empty.</div>;

            return (
                <div className="p-4">
                    {cartItems.map(item => (
                        <div key={item.ItemCode} className="flex justify-between items-center border-b py-3">
                            <div className="w-2/3">
                                <h4 className="text-sm font-semibold truncate">{item.ProductName}</h4>
                                <div className="text-xs text-gray-500">₹{item.DealerPrice} x {item.qty}</div>
                            </div>
                            <div className="font-bold text-gray-800">₹{item.DealerPrice * item.qty}</div>
                        </div>
                    ))}
                    <div className="mt-6 border-t-2 pt-4">
                        <div className="flex justify-between font-bold text-xl mb-6">
                            <span>Total</span>
                            <span className="text-blue-600">₹{totalAmount}</span>
                        </div>
                        <button onClick={handleCheckout} disabled={loading} className="w-full bg-green-600 text-white font-bold py-4 rounded-lg shadow-lg active:scale-95 flex justify-center">
                            {loading ? <div className="border-2 border-white w-6 h-6 rounded-full spinner"></div> : "Place Order Now"}
                        </button>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
